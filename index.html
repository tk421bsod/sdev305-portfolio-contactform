<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.png">
    <link rel="stylesheet" href="public/css/styles.css">
    <title>Contact Form</title>
</head>
<body>
    <div id="main-content">
        <h1 id="header">Contact Form</h1>
        <form id="form-body">
            <div class="form-fields">
                <div>
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name">
                </div>
                <div>
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name">    
                </div>
                <div>
                    <label for="job-title">Job Title</label>
                    <input type="text" id="job-title" name="job-title">
                </div>
                <div>
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company">
                </div>
                <div>
                    <label for="linkedin">LinkedIn URL</label>
                    <input type="text" id="linkedin" name="linkedin">
                </div>
                <div>
                    <label for="email">Email Address</label>
                    <input type="text" id="email" name="email">
                </div>
                <div>
                    <label for="source">How did we meet?</label>
                    <select id="source" name="source">
                        <option>Please select</option>
                        <option>Company event</option>
                        <option>LinkedIn connections</option>
                        <option>Other social media</option>
                        <option>Friends / family</option>
                        <option>Other</option>
                    </select>
                </div>
                <div>
                    <label for="source-other">Other (please specify)</label>
                    <input type="text" id="source-other" name="source-other">
                </div>
            </div>
            <label for="message">Message</label>
            <textarea id="message" name="message"></textarea>
            <div class="inline">
                <input type="checkbox" name="mailing-list" id="mailing-list" value="1"> 
                <label for="mailing-list">Please add me to your mailing list</label>
            </div>
            <div class="inline">
                <input type="radio" name="email-format" value="html">
                <label for="email-format">HTML</label>
                <input type="radio" name="email-format" value="text">
                <label for="email-format">Text</label>
            </div>
            <button type="submit" id="submit-button">Submit</button>
        </form>
    </div>
</body>
</html>
